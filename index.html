<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Colorborba</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hud">
    <div class="hud-row hud-left">
      <div class="target">
        <span class="target-label">Match</span>
        <span class="target-swatch" id="target-swatch" aria-label="Target color"></span>
        <span class="target-count" id="target-count" aria-label="Blobs needed">3</span>
      </div>
      <div class="chip score-chip" id="score-chip">
        <span class="chip-label">Score</span>
        <span class="chip-value" id="score-value">0</span>
      </div>
      <div class="chip streak-chip hidden" id="streak-chip">
        <span class="streak-flame" aria-hidden="true">&#x1F525;</span>
        <span class="chip-value" id="streak-value">&times;1</span>
      </div>
    </div>
    <div class="hud-row hud-right">
      <div class="chip best-chip" id="best-chip">
        <span class="chip-label">Best</span>
        <span class="chip-value" id="best-value">0</span>
      </div>
      <button id="reset-btn" class="reset-btn" type="button" aria-label="New puzzle">&#x21bb;</button>
    </div>
  </header>

  <canvas id="game" class="game"></canvas>

  <div id="score-popup" class="score-popup hidden" aria-hidden="true"></div>

  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="overlay-card">
      <h1 id="overlay-title">Nice mix!</h1>
      <p id="overlay-subtitle"></p>
      <button id="overlay-btn" class="primary-btn" type="button">Play again</button>
    </div>
  </div>

  <script src="src/color.js"></script>
  <script src="src/blob.js"></script>
  <script src="src/puzzle.js"></script>
  <script src="src/score.js"></script>
  <script src="src/particles.js"></script>
  <script src="src/input.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
