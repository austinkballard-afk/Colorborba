<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Medusa — Alien Jellyfish</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #030312; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hud {
    position: fixed; left: 24px; bottom: 20px; pointer-events: none;
    font-family: "Segoe UI", system-ui, sans-serif; color: #9fd8e8;
    text-shadow: 0 0 12px rgba(80, 220, 255, .35); user-select: none;
  }
  #hud h1 { font-size: 17px; font-weight: 300; letter-spacing: 6px; margin: 0 0 4px; text-transform: uppercase; }
  #hud p  { font-size: 11px; letter-spacing: 2px; margin: 0; opacity: .55; }
</style>
<canvas id="c"></canvas>
<div id="hud">
  <h1>Vel'maris Lumen Medusa</h1>
  <p>Specimen 7 &middot; Abyssal Trench of Kessel-9 &middot; move pointer to lure &middot; click to startle</p>
</div>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// slow ambient water current, sampled anywhere in the scene
function current(x, y, t) {
  return {
    x: Math.sin(y * 0.004 + t * 0.28) * 0.35 + Math.cos(x * 0.002 - t * 0.11) * 0.2,
    y: Math.cos(x * 0.003 + t * 0.17) * 0.16 - 0.05
  };
}

// ---------------------------------------------------------------- pointer
const pointer = { x: null, y: null, active: false };
window.addEventListener('pointermove', e => {
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true;
});
window.addEventListener('pointerleave', () => pointer.active = false);

const rings = [];   // startle shockwaves
const spores = [];  // glowing exhaust / panic spores
window.addEventListener('pointerdown', e => {
  rings.push({ x: e.clientX, y: e.clientY, r: 10, a: 0.9 });
  jelly.startle(e.clientX, e.clientY);
});

// ---------------------------------------------------------------- motes (plankton)
const motes = [];
for (let i = 0; i < 150; i++) {
  motes.push({
    x: Math.random() * 4000, y: Math.random() * 4000,
    z: rand(0.25, 1), tw: rand(0, TAU), hue: rand(150, 320)
  });
}

// ---------------------------------------------------------------- abyssal flora
function makeFlora() {
  const strands = [];
  const n = Math.max(5, Math.floor(W / 190));
  for (let i = 0; i < n; i++) {
    strands.push({
      x: (i + rand(0.15, 0.85)) * (W / n),
      h: rand(H * 0.16, H * 0.34),
      seg: 14, phase: rand(0, TAU), speed: rand(0.4, 0.9),
      hue: rand(90, 200), sway: rand(10, 26), bulb: rand(3, 7)
    });
  }
  return strands;
}
let flora = makeFlora();
window.addEventListener('resize', () => { flora = makeFlora(); makeVents(); makeAnemones(); });

// ---------------------------------------------------------------- background jellies
const drifters = [];
for (let i = 0; i < 5; i++) {
  drifters.push({
    x: rand(0, 2000), y: rand(0, 1200), s: rand(0.18, 0.45),
    hue: rand(160, 340), phase: rand(0, TAU), speed: rand(0.5, 1.1),
    vx: rand(-0.1, 0.1), vy: rand(-0.22, -0.08)
  });
}

// ---------------------------------------------------------------- the jellyfish
class Tentacle {
  constructor(nSeg, segLen, phase, weight) {
    this.n = nSeg; this.len = segLen; this.phase = phase; this.weight = weight;
    this.pts = Array.from({ length: nSeg }, () => ({ x: 0, y: 0 }));
    this.flare = 0; // startle response
  }
  anchor(x, y) { this.pts[0].x = x; this.pts[0].y = y; }
  update(t) {
    this.flare *= 0.95;
    const p = this.pts;
    for (let i = 1; i < this.n; i++) {
      const q = p[i], prev = p[i - 1];
      const c = current(q.x, q.y, t);
      // drift forces: water current, buoyancy sag, serpentine sway, flare kick
      q.x += c.x * 0.8 + Math.sin(t * 1.7 + this.phase + i * 0.42) * (0.35 + this.flare * 2.2);
      q.y += 0.55 * this.weight + c.y * 0.5 - this.flare * 1.4;
      // distance constraint back to parent segment
      const dx = q.x - prev.x, dy = q.y - prev.y;
      const d = Math.hypot(dx, dy) || 1;
      q.x = prev.x + (dx / d) * this.len;
      q.y = prev.y + (dy / d) * this.len;
    }
  }
}

class Jellyfish {
  constructor() {
    this.x = W / 2; this.y = H * 0.42;
    this.vx = 0; this.vy = 0;
    this.R = clamp(Math.min(W, H) * 0.16, 80, 150);
    this.phase = rand(0, TAU);
    this.hue = 195;         // drifts over time; jumps when startled
    this.hueTarget = 195;
    this.tilt = 0;
    this.panic = 0;
    this.wander = { x: W / 2, y: H / 2, t: 0 };
    this.lobes = 9;
    this.tentacles = [];
    for (let i = 0; i < this.lobes; i++)
      this.tentacles.push(new Tentacle(24, this.R * 0.115, rand(0, TAU), 1));
    this.arms = [];
    for (let i = 0; i < 4; i++)
      this.arms.push(new Tentacle(16, this.R * 0.14, rand(0, TAU), 0.7));
  }

  startle(x, y) {
    this.panic = 1;
    this.hueTarget = (this.hueTarget + rand(70, 160)) % 360;
    const dx = this.x - x, dy = this.y - y, d = Math.hypot(dx, dy) || 1;
    this.vx += (dx / d) * 6; this.vy += (dy / d) * 6;
    for (const t of [...this.tentacles, ...this.arms]) t.flare = 1;
    for (let i = 0; i < 40; i++) {
      const a = rand(0, TAU), sp = rand(0.5, 3.2);
      spores.push({ x: this.x, y: this.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                    a: 1, r: rand(1, 3.4), hue: this.hueTarget });
    }
    // the dartfish school panics too
    for (const f of school) {
      const fdx = f.x - x, fdy = f.y - y, fd = Math.hypot(fdx, fdy) || 1;
      const kick = 700 / (fd + 60);
      f.vx += (fdx / fd) * kick; f.vy += (fdy / fd) * kick;
    }
  }

  update(t, dt) {
    this.phase += dt * (1.5 + this.panic * 2.5);
    this.panic *= 0.985;
    this.hue += (this.hueTarget - this.hue) * 0.02;
    this.hueTarget += dt * 2; // slow ambient color drift

    // pulse cycle: sharp contraction, slow relax
    const cyc = (this.phase % TAU) / TAU;
    this.c = cyc < 0.3 ? Math.sin(cyc / 0.3 * Math.PI / 2) : Math.cos((cyc - 0.3) / 0.7 * Math.PI / 2);

    // steer: toward pointer if present, otherwise a lazy wander point
    this.wander.t -= dt;
    if (this.wander.t <= 0) {
      this.wander = { x: rand(W * 0.2, W * 0.8), y: rand(H * 0.18, H * 0.6), t: rand(4, 9) };
    }
    const tx = pointer.active ? pointer.x : this.wander.x;
    const ty = pointer.active ? pointer.y : this.wander.y;
    const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy) || 1;

    // thrust on contraction, aimed at target
    const thrust = Math.max(0, Math.sin(cyc * TAU)) * 0.05 * (1 + this.panic * 2);
    this.vx += (dx / d) * thrust; this.vy += (dy / d) * thrust;
    const c = current(this.x, this.y, t);
    this.vx += c.x * 0.01; this.vy += c.y * 0.01;
    this.vx *= 0.985; this.vy *= 0.985;
    this.x += this.vx; this.y += this.vy;
    this.x = clamp(this.x, this.R, W - this.R);
    this.y = clamp(this.y, this.R, H - this.R * 0.6);
    this.tilt += (clamp(this.vx * 0.06, -0.5, 0.5) - this.tilt) * 0.04;

    // exhale spores at peak contraction
    if (cyc < 0.05 && Math.random() < 0.5) {
      spores.push({ x: this.x + rand(-20, 20), y: this.y + this.R * 0.5,
                    vx: rand(-0.3, 0.3), vy: rand(0.6, 1.6),
                    a: 0.8, r: rand(0.8, 2.2), hue: this.hue + rand(-30, 30) });
    }

    // anchor + simulate appendages
    const rw = this.R * (1 - 0.3 * this.c);
    const cosT = Math.cos(this.tilt), sinT = Math.sin(this.tilt);
    const loc = (lx, ly) => ({ x: this.x + lx * cosT - ly * sinT, y: this.y + lx * sinT + ly * cosT });
    this.tentacles.forEach((tn, i) => {
      const u = i / (this.lobes - 1);
      const p = loc(lerp(-rw, rw, u) * 0.92, this.R * 0.18 + Math.sin(u * Math.PI) * -this.R * 0.05);
      tn.anchor(p.x, p.y); tn.update(t);
    });
    this.arms.forEach((ar, i) => {
      const u = (i + 0.5) / 4;
      const p = loc(lerp(-rw, rw, u) * 0.4, this.R * 0.22);
      ar.anchor(p.x, p.y); ar.update(t);
    });
  }

  drawAppendage(tn, width, sat, light, alphaMul) {
    const p = tn.pts;
    for (let i = 1; i < tn.n; i++) {
      const f = i / tn.n;
      ctx.strokeStyle = `hsla(${this.hue + f * 60}, ${sat}%, ${light}%, ${(1 - f) * alphaMul})`;
      ctx.lineWidth = width * (1 - f * 0.85);
      ctx.beginPath();
      ctx.moveTo(p[i - 1].x, p[i - 1].y);
      ctx.lineTo(p[i].x, p[i].y);
      ctx.stroke();
    }
    // glowing tip
    const tip = p[tn.n - 1];
    const g = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, 7);
    g.addColorStop(0, `hsla(${this.hue + 70}, 100%, 75%, ${0.7 + tn.flare * 0.3})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(tip.x, tip.y, 7, 0, TAU); ctx.fill();
  }

  draw(t) {
    const R = this.R, c = this.c;
    const rw = R * (1 - 0.3 * c);        // rim half-width (narrows on pulse)
    const hh = R * 0.95 * (1 + 0.3 * c); // bell height (stretches on pulse)

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    // trailing tentacles first (behind the bell)
    for (const tn of this.tentacles) this.drawAppendage(tn, R * 0.045, 90, 62, 0.5);

    ctx.translate(this.x, this.y);
    ctx.rotate(this.tilt);

    // ambient halo
    let g = ctx.createRadialGradient(0, -hh * 0.3, 0, 0, -hh * 0.3, R * 2.4);
    g.addColorStop(0, `hsla(${this.hue}, 90%, 60%, ${0.14 + this.panic * 0.12})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -hh * 0.3, R * 2.4, 0, TAU); ctx.fill();

    // ---- bell membrane: dome + scalloped skirt
    const skirt = [];
    for (let i = 0; i <= this.lobes * 8; i++) {
      const u = i / (this.lobes * 8);
      const x = lerp(-rw, rw, u);
      const dip = Math.pow(Math.sin(u * Math.PI * this.lobes), 2) * R * 0.14 * (1 - 0.5 * c);
      const belly = Math.sin(u * Math.PI) * R * 0.10;
      skirt.push({ x, y: R * 0.18 + dip + belly });
    }
    ctx.beginPath();
    ctx.moveTo(skirt[0].x, skirt[0].y);
    ctx.bezierCurveTo(-rw * 1.18, -hh * 0.42, -rw * 0.62, -hh * 1.06, 0, -hh);
    ctx.bezierCurveTo(rw * 0.62, -hh * 1.06, rw * 1.18, -hh * 0.42, skirt[skirt.length - 1].x, skirt[skirt.length - 1].y);
    for (let i = skirt.length - 1; i >= 0; i--) ctx.lineTo(skirt[i].x, skirt[i].y);
    ctx.closePath();
    g = ctx.createRadialGradient(0, -hh * 0.45, R * 0.1, 0, -hh * 0.35, R * 1.35);
    g.addColorStop(0.0, `hsla(${this.hue + 40}, 100%, 72%, 0.30)`);
    g.addColorStop(0.55, `hsla(${this.hue}, 95%, 55%, 0.16)`);
    g.addColorStop(1.0, `hsla(${this.hue - 40}, 90%, 45%, 0.05)`);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = `hsla(${this.hue + 20}, 100%, 78%, 0.55)`;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // ---- radial canals (iridescent ribs)
    for (let i = 0; i < this.lobes; i++) {
      const u = i / (this.lobes - 1);
      const rx = lerp(-rw, rw, u) * 0.9;
      ctx.strokeStyle = `hsla(${this.hue + u * 120}, 100%, 70%, 0.28)`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(0, -hh * 0.92);
      ctx.quadraticCurveTo(rx * 0.5, -hh * 0.5, rx, R * 0.16);
      ctx.stroke();
    }

    // ---- rotating tri-spiral core (the alien "organ")
    const spin = t * 0.7;
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = `hsla(${this.hue + 90 + k * 25}, 100%, 70%, 0.5)`;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      for (let j = 0; j <= 26; j++) {
        const f = j / 26;
        const a = spin + k * TAU / 3 + f * 2.6;
        const r = f * R * 0.42 * (1 - 0.2 * c);
        const x = Math.cos(a) * r, y = -hh * 0.42 + Math.sin(a) * r * 0.62;
        j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    g = ctx.createRadialGradient(0, -hh * 0.42, 0, 0, -hh * 0.42, R * 0.4);
    g.addColorStop(0, `hsla(${this.hue + 110}, 100%, 82%, ${0.55 + 0.3 * Math.sin(t * 3)})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -hh * 0.42, R * 0.4, 0, TAU); ctx.fill();

    // ---- bioluminescent rim beads, firing in sequence
    for (let i = 0; i < this.lobes; i++) {
      const u = i / (this.lobes - 1);
      const bx = lerp(-rw, rw, u) * 0.92;
      const by = R * 0.16;
      const pulse = 0.5 + 0.5 * Math.sin(t * 4 - i * 0.9 + this.panic * 6);
      const rad = 3 + pulse * 5 + this.panic * 4;
      g = ctx.createRadialGradient(bx, by, 0, bx, by, rad * 2.2);
      g.addColorStop(0, `hsla(${this.hue + 60}, 100%, 80%, ${0.5 + pulse * 0.5})`);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bx, by, rad * 2.2, 0, TAU); ctx.fill();
    }
    ctx.restore();

    // oral arms in front of the bell
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const ar of this.arms) this.drawAppendage(ar, R * 0.085, 70, 68, 0.34);
    ctx.restore();
  }
}
const jelly = new Jellyfish();

// ---------------------------------------------------------------- scene layers
function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const drift = Math.sin(t * 0.05) * 14;
  g.addColorStop(0, `hsl(${226 + drift}, 65%, 10%)`);
  g.addColorStop(0.55, `hsl(${258 + drift}, 55%, 7%)`);
  g.addColorStop(1, `hsl(${190 + drift}, 60%, 5%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // faint nebula blooms in the water column
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const x = W * (0.2 + 0.3 * i) + Math.sin(t * 0.07 + i * 2.1) * W * 0.08;
    const y = H * (0.25 + 0.22 * i) + Math.cos(t * 0.05 + i) * H * 0.06;
    const r = Math.min(W, H) * (0.32 + i * 0.08);
    const bg = ctx.createRadialGradient(x, y, 0, x, y, r);
    bg.addColorStop(0, `hsla(${200 + i * 60 + drift * 2}, 80%, 45%, 0.045)`);
    bg.addColorStop(1, 'transparent');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawRays(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) {
    const cx = W * (0.12 + i * 0.16) + Math.sin(t * 0.1 + i * 1.7) * 60;
    const sway = Math.sin(t * 0.14 + i) * W * 0.06;
    const wTop = 26 + i * 8;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsla(${185 + i * 10}, 80%, 65%, ${0.05 + 0.02 * Math.sin(t * 0.5 + i)})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx - wTop, -10);
    ctx.lineTo(cx + wTop, -10);
    ctx.lineTo(cx + sway + wTop * 3.4, H);
    ctx.lineTo(cx + sway - wTop * 3.4, H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawMotes(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    const c = current(m.x, m.y, t);
    m.x += c.x * m.z * 1.4; m.y += c.y * m.z * 1.4 - 0.08 * m.z;
    const x = ((m.x % W) + W) % W, y = ((m.y % H) + H) % H;
    const tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * 2 + m.tw));
    ctx.fillStyle = `hsla(${m.hue}, 90%, 75%, ${0.12 + 0.3 * m.z * tw})`;
    ctx.beginPath(); ctx.arc(x, y, 0.6 + m.z * 1.7, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawFlora(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const f of flora) {
    let x = f.x, y = H + 4;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let i = 1; i <= f.seg; i++) {
      const u = i / f.seg;
      x = f.x + Math.sin(t * f.speed + f.phase + u * 3) * f.sway * u;
      y = H + 4 - f.h * u;
      ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `hsla(${f.hue + Math.sin(t * 0.3 + f.phase) * 30}, 80%, 55%, 0.22)`;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    const pulse = 0.5 + 0.5 * Math.sin(t * 1.6 + f.phase);
    const g = ctx.createRadialGradient(x, y, 0, x, y, f.bulb * (2 + pulse * 2));
    g.addColorStop(0, `hsla(${f.hue + 40}, 100%, 75%, ${0.35 + pulse * 0.4})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, f.bulb * (2 + pulse * 2), 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawDrifters(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const d of drifters) {
    d.x += d.vx; d.y += d.vy;
    const x = ((d.x % (W + 200)) + W + 200) % (W + 200) - 100;
    const y = ((d.y % (H + 200)) + H + 200) % (H + 200) - 100;
    const c = 0.5 + 0.5 * Math.sin(t * d.speed + d.phase);
    const r = 60 * d.s * (1 + 0.2 * c) * 3;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `hsla(${d.hue}, 90%, 65%, ${0.16 * d.s + 0.1})`);
    g.addColorStop(0.35, `hsla(${d.hue}, 90%, 55%, ${0.05})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y, 60 * d.s * (1 - 0.25 * c), 50 * d.s * (1 + 0.25 * c), 0, Math.PI, TAU);
    ctx.fill();
    ctx.strokeStyle = `hsla(${d.hue + 40}, 90%, 70%, ${0.25 * d.s + 0.05})`;
    ctx.lineWidth = 1;
    for (let k = 0; k < 4; k++) {
      const tx = x - 45 * d.s + k * 30 * d.s;
      ctx.beginPath();
      ctx.moveTo(tx, y + 4);
      ctx.quadraticCurveTo(tx + Math.sin(t + k + d.phase) * 12 * d.s, y + 50 * d.s,
                           tx + Math.sin(t * 1.3 + k) * 18 * d.s, y + 95 * d.s);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawEffects() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += 7; r.a *= 0.94;
    if (r.a < 0.02) { rings.splice(i, 1); continue; }
    ctx.strokeStyle = `hsla(${jelly.hue + 40}, 100%, 75%, ${r.a})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  for (let i = spores.length - 1; i >= 0; i--) {
    const s = spores[i];
    s.x += s.vx; s.y += s.vy; s.vx *= 0.985; s.vy = s.vy * 0.985 + 0.015;
    s.a *= 0.985;
    if (s.a < 0.02) { spores.splice(i, 1); continue; }
    ctx.fillStyle = `hsla(${s.hue}, 100%, 72%, ${s.a * 0.8})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// ---------------------------------------------------------------- aurora shimmer bands
function drawAurora(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (let k = 0; k < 3; k++) {
    const baseY = H * (0.07 + k * 0.055);
    ctx.beginPath();
    for (let i = 0; i <= 60; i++) {
      const u = i / 60;
      const y = baseY + Math.sin(u * 7 + t * (0.5 + k * 0.2) + k * 2) * 16
                      + Math.sin(u * 17 - t * 0.9 + k) * 6;
      i ? ctx.lineTo(u * W, y) : ctx.moveTo(0, y);
    }
    ctx.strokeStyle = `hsla(${170 + k * 45 + Math.sin(t * 0.2) * 20}, 90%, 60%, ${0.05 + 0.03 * Math.sin(t * 0.7 + k * 2)})`;
    ctx.lineWidth = 14 - k * 4;
    ctx.stroke();
  }
  ctx.restore();
}

// ---------------------------------------------------------------- the leviathan (far background)
const leviathan = { active: false, timer: 7, dir: 1, x: 0, y: 0, speed: 0, len: 0, ph: 0 };
function updateLeviathan(t, dt) {
  const L = leviathan;
  if (!L.active) {
    L.timer -= dt;
    if (L.timer > 0) return;
    L.active = true;
    L.dir = Math.random() < 0.5 ? 1 : -1;
    L.len = Math.min(W, 1500) * rand(0.55, 0.8);
    L.x = L.dir > 0 ? -L.len : W + L.len;
    L.y = rand(H * 0.15, H * 0.45);
    L.speed = rand(30, 50) * L.dir;
    L.ph = rand(0, TAU);
  }
  L.x += L.speed * dt;
  if ((L.dir > 0 && L.x > W + L.len * 1.2) || (L.dir < 0 && L.x < -L.len * 1.2)) {
    L.active = false;
    L.timer = rand(16, 34);
    return;
  }
  const nodes = 22;
  const spine = [];
  for (let i = 0; i < nodes; i++) {
    const u = i / (nodes - 1);
    spine.push({
      x: L.x - L.dir * u * L.len,
      y: L.y + Math.sin(t * 0.9 + L.ph + u * 3.4) * L.len * 0.04 * (0.2 + u), // tail sways more
      r: L.len * 0.085 * Math.pow(1 - u, 0.55) + 2
    });
  }
  ctx.save();
  // silhouette body — a shadow moving through the fog
  ctx.fillStyle = 'rgba(2, 4, 14, 0.5)';
  for (const s of spine) {
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  // dorsal sail
  const dh = spine[2];
  ctx.beginPath();
  ctx.moveTo(dh.x, dh.y - dh.r * 0.6);
  ctx.quadraticCurveTo(dh.x - L.dir * L.len * 0.12, dh.y - dh.r * 2.6, dh.x - L.dir * L.len * 0.3, dh.y - dh.r * 0.5);
  ctx.closePath(); ctx.fill();
  // photophore rows + eye
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 2; i < nodes - 1; i += 2) {
    const s = spine[i];
    const pulse = 0.5 + 0.5 * Math.sin(t * 2.2 - i * 0.8 + L.ph);
    for (const off of [-0.45, 0.45]) {
      const g = ctx.createRadialGradient(s.x, s.y + s.r * off, 0, s.x, s.y + s.r * off, 5 + pulse * 4);
      g.addColorStop(0, `hsla(${300 + i * 6}, 100%, 75%, ${0.12 + pulse * 0.25})`);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y + s.r * off, 5 + pulse * 4, 0, TAU); ctx.fill();
    }
  }
  const eye = spine[0];
  const eg = ctx.createRadialGradient(eye.x + L.dir * eye.r * 0.5, eye.y - eye.r * 0.25, 0,
                                      eye.x + L.dir * eye.r * 0.5, eye.y - eye.r * 0.25, 9);
  eg.addColorStop(0, 'hsla(10, 100%, 70%, 0.8)');
  eg.addColorStop(1, 'transparent');
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(eye.x + L.dir * eye.r * 0.5, eye.y - eye.r * 0.25, 9, 0, TAU); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------- dartfish school (flocking)
const school = [];
for (let i = 0; i < 36; i++) {
  const a = rand(0, TAU);
  school.push({ x: rand(0.1, 0.9) * W, y: rand(0.1, 0.6) * H,
                vx: Math.cos(a) * 1.5, vy: Math.sin(a) * 1.5,
                hue: rand(155, 205), ph: rand(0, TAU), scare: 0 });
}
function updateDrawSchool(t) {
  let cx = 0, cy = 0, hx = 0, hy = 0;
  for (const f of school) { cx += f.x; cy += f.y; hx += f.vx; hy += f.vy; }
  cx /= school.length; cy /= school.length; hx /= school.length; hy /= school.length;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const f of school) {
    // cohesion + alignment
    f.vx += (cx - f.x) * 0.0012 + (hx - f.vx) * 0.02;
    f.vy += (cy - f.y) * 0.0012 + (hy - f.vy) * 0.02;
    // separation
    for (const o of school) {
      if (o === f) continue;
      const dx = f.x - o.x, dy = f.y - o.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 500 && d2 > 0.01) { f.vx += dx / d2 * 3; f.vy += dy / d2 * 3; }
    }
    // fear the medusa
    const jdx = f.x - jelly.x, jdy = f.y - jelly.y;
    const jd = Math.hypot(jdx, jdy), fear = jelly.R * 2.4;
    if (jd < fear && jd > 1) {
      const push = (1 - jd / fear) * 0.4 * (1 + jelly.panic * 4);
      f.vx += jdx / jd * push; f.vy += jdy / jd * push;
    }
    // water current + individual jitter
    const c = current(f.x, f.y, t);
    f.vx += c.x * 0.02 + Math.sin(t * 2.1 + f.ph) * 0.012;
    f.vy += c.y * 0.02;
    // steer back from the edges
    const m = 70;
    if (f.x < m) f.vx += 0.07; if (f.x > W - m) f.vx -= 0.07;
    if (f.y < m) f.vy += 0.07; if (f.y > H * 0.82) f.vy -= 0.07;
    // speed envelope (scared fish sprint)
    f.scare *= 0.96;
    const sp = Math.hypot(f.vx, f.vy) || 1;
    const max = 2.6 + f.scare * 5, min = 0.7;
    if (sp > max) { f.vx *= max / sp; f.vy *= max / sp; }
    if (sp < min) { f.vx *= min / sp; f.vy *= min / sp; }
    f.x += f.vx; f.y += f.vy;

    // draw: a glowing dart with a beating tail
    const ang = Math.atan2(f.vy, f.vx);
    const wob = Math.sin(t * 14 + f.ph) * 1.6;
    const tx = f.x - Math.cos(ang) * 9 + Math.cos(ang + Math.PI / 2) * wob;
    const ty = f.y - Math.sin(ang) * 9 + Math.sin(ang + Math.PI / 2) * wob;
    const grad = ctx.createLinearGradient(f.x, f.y, tx, ty);
    grad.addColorStop(0, `hsla(${f.hue + f.scare * 60}, 100%, 75%, 0.85)`);
    grad.addColorStop(1, `hsla(${f.hue + 45}, 90%, 60%, 0)`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(tx, ty); ctx.stroke();
  }
  ctx.restore();
}

// ---------------------------------------------------------------- lantern eel
const eel = { x: -150, y: H * 0.35, ang: 0, wig: rand(0, TAU), trail: [], n: 74, hue: 38 };
function updateDrawEel(t) {
  const e = eel;
  // serpentine wiggle + slow wander + steer back toward open water
  e.ang += Math.sin(t * 2.3 + e.wig) * 0.05 + Math.sin(t * 0.31 + e.wig * 2) * 0.02;
  const m = 90;
  if (e.x < m || e.x > W - m || e.y < m || e.y > H * 0.75) {
    const ta = Math.atan2(H * 0.4 - e.y, W / 2 - e.x);
    let da = ta - e.ang;
    while (da > Math.PI) da -= TAU;
    while (da < -Math.PI) da += TAU;
    e.ang += da * 0.035;
  }
  e.x += Math.cos(e.ang) * 2.1;
  e.y += Math.sin(e.ang) * 2.1;
  e.trail.unshift({ x: e.x, y: e.y });
  if (e.trail.length > e.n) e.trail.pop();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  const p = e.trail;
  for (let i = 1; i < p.length; i++) {
    const f = i / e.n;
    ctx.strokeStyle = `hsla(${e.hue + f * 30}, 95%, ${62 - f * 18}%, ${0.5 * (1 - f * 0.85)})`;
    ctx.lineWidth = 5.5 * (1 - f) + 0.6;
    ctx.beginPath(); ctx.moveTo(p[i - 1].x, p[i - 1].y); ctx.lineTo(p[i].x, p[i].y); ctx.stroke();
  }
  // lantern bulbs pulsing down the body
  for (let i = 8; i < p.length; i += 13) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 5 - i * 0.5);
    const r = 5 + pulse * 5;
    const g = ctx.createRadialGradient(p[i].x, p[i].y, 0, p[i].x, p[i].y, r);
    g.addColorStop(0, `hsla(${e.hue}, 100%, 78%, ${0.3 + pulse * 0.45})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p[i].x, p[i].y, r, 0, TAU); ctx.fill();
  }
  // incandescent head
  const hg = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, 11);
  hg.addColorStop(0, `hsla(${e.hue + 15}, 100%, 85%, 0.9)`);
  hg.addColorStop(1, 'transparent');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(e.x, e.y, 11, 0, TAU); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------- drifting crystal shards
const crystals = [];
for (let i = 0; i < 9; i++) {
  crystals.push({ x: rand(0, 3000), y: rand(0, 2000), z: rand(0.4, 1),
                  r: rand(5, 13), sides: 3 + (i % 4), rot: rand(0, TAU),
                  vrot: rand(-0.012, 0.012), hue: rand(260, 360), ph: rand(0, TAU) });
}
function drawCrystals(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const cr of crystals) {
    const c = current(cr.x, cr.y, t);
    cr.x += c.x * cr.z; cr.y += c.y * cr.z + Math.sin(t * 0.4 + cr.ph) * 0.15;
    cr.rot += cr.vrot;
    const x = ((cr.x % W) + W) % W, y = ((cr.y % H) + H) % H;
    const glint = Math.pow(0.5 + 0.5 * Math.sin(t * 1.3 + cr.ph), 4);
    const R = cr.r * cr.z;
    ctx.strokeStyle = `hsla(${cr.hue}, 95%, 75%, ${0.12 + glint * 0.55})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let k = 0; k <= cr.sides; k++) {
      const a = cr.rot + (k / cr.sides) * TAU;
      k ? ctx.lineTo(x + Math.cos(a) * R, y + Math.sin(a) * R * 1.5)
        : ctx.moveTo(x + Math.cos(a) * R, y + Math.sin(a) * R * 1.5);
    }
    ctx.stroke();
    if (glint > 0.5) { // the facet catches a ray of light
      const g = ctx.createRadialGradient(x, y, 0, x, y, R * 3);
      g.addColorStop(0, `hsla(${cr.hue}, 100%, 85%, ${(glint - 0.5) * 0.7})`);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, R * 3, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

// ---------------------------------------------------------------- hydrothermal vents
const vents = [], bubbles = [];
function makeVents() {
  vents.length = 0;
  const n = W > 1100 ? 3 : 2;
  for (let i = 0; i < n; i++) {
    vents.push({ x: (i + rand(0.25, 0.75)) * (W / n), hue: rand(150, 215),
                 timer: 0, ph: rand(0, TAU) });
  }
}
makeVents();
function drawVents(t, dt) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const v of vents) {
    const flick = 0.5 + 0.5 * Math.sin(t * 3.1 + v.ph) * Math.sin(t * 1.3 + v.ph * 2);
    // shimmering thermal column
    const g = ctx.createLinearGradient(0, H, 0, H * 0.45);
    g.addColorStop(0, `hsla(${v.hue}, 90%, 60%, ${0.05 + flick * 0.05})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    const lean = Math.sin(t * 0.6 + v.ph) * 20;
    ctx.beginPath();
    ctx.moveTo(v.x - 12, H); ctx.lineTo(v.x + 12, H);
    ctx.lineTo(v.x + lean + 46, H * 0.45); ctx.lineTo(v.x + lean - 46, H * 0.45);
    ctx.closePath(); ctx.fill();
    // glowing vent mouth
    const mg = ctx.createRadialGradient(v.x, H, 0, v.x, H, 28);
    mg.addColorStop(0, `hsla(${v.hue}, 100%, 70%, ${0.35 + flick * 0.3})`);
    mg.addColorStop(1, 'transparent');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(v.x, H, 28, 0, TAU); ctx.fill();
    // exhale bubbles
    v.timer -= dt;
    if (v.timer <= 0) {
      v.timer = rand(0.08, 0.3);
      bubbles.push({ x: v.x + rand(-8, 8), y: H + 4, vy: rand(-1.9, -0.9),
                     r: rand(1.5, 4.5), ph: rand(0, TAU), hue: v.hue, a: rand(0.4, 0.8) });
    }
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y += b.vy; b.x += Math.sin(t * 3 + b.ph) * 0.5;
    b.a -= 0.002;
    if (b.a <= 0.02 || b.y < H * 0.3) { bubbles.splice(i, 1); continue; }
    ctx.strokeStyle = `hsla(${b.hue}, 90%, 78%, ${b.a})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
    ctx.fillStyle = `hsla(${b.hue}, 100%, 88%, ${b.a * 0.5})`;
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.3, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// ---------------------------------------------------------------- seafloor anemones
const anemones = [];
function makeAnemones() {
  anemones.length = 0;
  const n = Math.max(3, Math.floor(W / 320));
  for (let i = 0; i < n; i++) {
    anemones.push({ x: (i + rand(0.2, 0.8)) * (W / n), r: rand(14, 30),
                    hue: rand(280, 360), nT: 7 + Math.floor(rand(0, 5)), ph: rand(0, TAU) });
  }
}
makeAnemones();
function drawAnemones(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const an of anemones) {
    const breathe = 0.5 + 0.5 * Math.sin(t * 0.9 + an.ph);
    // luminous dome
    const g = ctx.createRadialGradient(an.x, H, 0, an.x, H, an.r * 1.6);
    g.addColorStop(0, `hsla(${an.hue}, 85%, 60%, ${0.22 + breathe * 0.15})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(an.x, H, an.r * 1.6, Math.PI, TAU); ctx.fill();
    // breathing tendrils fanning out of the dome
    for (let k = 0; k < an.nT; k++) {
      const u = k / (an.nT - 1);
      const bx = an.x + (u - 0.5) * an.r * 1.4;
      const wave = Math.sin(t * 1.4 + an.ph + k) * 8;
      const len = an.r * (1.3 + breathe * 0.8) * (0.7 + Math.sin(u * Math.PI) * 0.5);
      const tx = bx + (u - 0.5) * an.r * 1.2 + wave;
      const ty = H - len;
      ctx.strokeStyle = `hsla(${an.hue + k * 6}, 90%, 68%, 0.35)`;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(bx, H);
      ctx.quadraticCurveTo(bx + wave * 0.5, H - len * 0.6, tx, ty);
      ctx.stroke();
      const pulse = 0.5 + 0.5 * Math.sin(t * 2.2 + k * 1.7 + an.ph);
      const tg = ctx.createRadialGradient(tx, ty, 0, tx, ty, 3 + pulse * 4);
      tg.addColorStop(0, `hsla(${an.hue + 40}, 100%, 80%, ${0.25 + pulse * 0.5})`);
      tg.addColorStop(1, 'transparent');
      ctx.fillStyle = tg;
      ctx.beginPath(); ctx.arc(tx, ty, 3 + pulse * 4, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

// ---------------------------------------------------------------- distant bioluminescent flashes
const flash = { next: rand(4, 10), a: 0, x: 0, y: 0, hue: 200 };
function drawFlash(dt) {
  flash.next -= dt;
  if (flash.next <= 0) {
    flash.next = rand(6, 15);
    flash.a = rand(0.4, 0.85);
    flash.x = rand(0.1, 0.9) * W;
    flash.y = rand(0, 0.35) * H;
    flash.hue = rand(180, 300);
  }
  if (flash.a > 0.01) {
    flash.a *= 0.87;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const r = Math.max(W, H) * 0.5;
    const g = ctx.createRadialGradient(flash.x, flash.y, 0, flash.x, flash.y, r);
    g.addColorStop(0, `hsla(${flash.hue}, 90%, 70%, ${flash.a * 0.35})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(flash.x, flash.y, r, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

// ---------------------------------------------------------------- main loop
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0.001, 0.05);
  last = now;
  const t = now / 1000;

  drawBackground(t);
  drawAurora(t);
  drawRays(t);
  updateLeviathan(t, dt);
  drawDrifters(t);
  drawCrystals(t);
  drawMotes(t);
  updateDrawEel(t);
  drawFlora(t);
  drawAnemones(t);
  drawVents(t, dt);
  updateDrawSchool(t);
  jelly.update(t, dt);
  jelly.draw(t);
  drawEffects();
  drawFlash(dt);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
